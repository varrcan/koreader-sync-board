name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  binaries:
    name: Binaries (linux amd64, arm64) to GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F web build
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build and package
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          pkg=github.com/varrcan/koreader-sync-board/server/internal/buildinfo
          ldflags="-s -w -X $pkg.Version=$VERSION -X $pkg.Commit=$(git rev-parse --short HEAD)"
          mkdir dist
          for arch in amd64 arm64; do
            name="ksb_${VERSION}_linux_${arch}"
            mkdir "$name"
            GOOS=linux GOARCH=$arch go -C server build -trimpath -tags webdist -ldflags "$ldflags" -o "../$name/ksb" ./cmd/ksb
            cp LICENSE README.md README_ru.md "$name/"
            tar -czf "dist/$name.tar.gz" -C "$name" ksb LICENSE README.md README_ru.md
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - name: Smoke test amd64
        run: |
          mkdir smoke
          tar -xzf "dist/ksb_${GITHUB_REF_NAME}_linux_amd64.tar.gz" -C smoke
          smoke/ksb version | grep -F "$GITHUB_REF_NAME"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # Тег с дефисом (v1.0.0-rc.1) — пре-релиз: GitHub не покажет его как последний.
        run: |
          flags=(--generate-notes --verify-tag)
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/*

  docker:
    name: Docker image (amd64, arm64) to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # Пре-релиз не должен становиться latest; {{major}}.{{minor}} для него
          # metadata-action и так не выпускает.
          flavor: latest=${{ !contains(github.ref_name, '-') }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
