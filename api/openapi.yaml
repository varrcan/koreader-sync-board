openapi: 3.0.3
info:
  title: koreader-sync-board panel API
  version: 0.1.0
  description: |
    API веб-панели. Ошибки возвращаются машинно-читаемым кодом, текст для
    пользователя переводит клиент. Протокол синхронизации KOReader (kosync)
    обслуживается в корне URL и здесь не описан.

    Авторизация — cookie сессии `ksb_session` (`HttpOnly`, `SameSite=Lax`), которую
    ставят вход и мастер настройки. Без сессии доступны только health, version,
    вход, выход и мастер; остальные операции отвечают 401 `unauthorized`.
    Изменяющие запросы из браузера с чужого origin отклоняются с 403 `cross_origin`.
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Проверка работоспособности
      description: Без авторизации и без требований к заголовкам; для оркестраторов и `ksb healthcheck`.
      tags: [system]
      responses:
        "200":
          description: Сервер работает
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/version:
    get:
      operationId: getVersion
      summary: Версия сборки
      tags: [system]
      responses:
        "200":
          description: Версия и коммит, заданные при сборке
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Вход в панель
      description: |
        Проверяет пароль панели и открывает сессию. Неизвестное имя, неверный пароль,
        отключённый пользователь и пользователь без пароля панели дают одинаковый
        ответ. Неудачи расходуют бюджет ограничителя по адресу, общий с kosync.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Вход выполнен, cookie сессии выставлена
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          description: "`invalid_credentials`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Выход
      description: Удаляет текущую сессию и стирает cookie. Без сессии ничего не делает.
      tags: [auth]
      responses:
        "204":
          description: Сессии больше нет
        "403":
          $ref: "#/components/responses/CrossOrigin"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me:
    get:
      operationId: getMe
      summary: Текущий пользователь
      tags: [auth]
      responses:
        "200":
          description: Владелец сессии
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/password:
    put:
      operationId: changePassword
      summary: Смена своего пароля панели
      description: |
        Меняет пароль при верном текущем и удаляет все остальные сессии пользователя;
        текущая остаётся. Неверный текущий пароль расходует бюджет ограничителя.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Пароль изменён
        "400":
          description: "`invalid_password` или `bad_request`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`invalid_credentials` (неверный текущий пароль) или `cross_origin`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/setup:
    get:
      operationId: getSetup
      summary: Нужен ли мастер первого запуска
      tags: [setup]
      responses:
        "200":
          description: "`required` истинно, пока пользователей нет и код настройки существует"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: completeSetup
      summary: Создать первого администратора
      description: |
        По коду настройки из лога сервера создаёт администратора и открывает ему
        сессию. Неверный код расходует бюджет ограничителя; ошибка имени или пароля
        при верном коде — нет, и код остаётся действительным.
      tags: [setup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "200":
          description: Администратор создан, cookie сессии выставлена
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: "`invalid_username`, `invalid_password` или `bad_request`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "`invalid_setup_code` или `cross_origin`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`setup_completed`: пользователи уже есть"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/devices:
    get:
      operationId: listDevices
      summary: Устройства
      description: |
        Свои устройства, включая отозванные; администратору — устройства всех
        пользователей. Ключи и их хеши в ответ не попадают.
      tags: [devices]
      responses:
        "200":
          description: Устройства по владельцу и времени создания
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createDevice
      summary: Создать устройство
      description: |
        Создаёт устройство и возвращает его пароль. Пароль показывается только в
        этом ответе. Без `username` устройство создаётся владельцу сессии; другого
        пользователя может указать только администратор.
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeviceRequest"
      responses:
        "201":
          description: Устройство создано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceWithPassword"
        "400":
          description: "`invalid_device_name` или `bad_request`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`forbidden` (чужой `username` у не администратора) или `cross_origin`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "`user_not_found`: пользователя `username` нет"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/DeviceExists"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/devices/{id}:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    patch:
      operationId: renameDevice
      summary: Переименовать устройство
      description: Меняет имя действующего устройства; ключ остаётся прежним.
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameDeviceRequest"
      responses:
        "200":
          description: Устройство с новым именем
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          description: "`invalid_device_name` или `bad_request`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DeviceExists"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: revokeDevice
      summary: Отозвать устройство
      description: |
        Ключ устройства перестаёт действовать сразу. Запись остаётся: на неё
        ссылается журнал прогресса. Повторный отзыв не меняет время отзыва.
      tags: [devices]
      responses:
        "204":
          description: Устройство отозвано
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/devices/{id}/password:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    post:
      operationId: resetDevicePassword
      summary: Новый пароль устройства
      description: |
        Выдаёт действующему устройству новый пароль и возвращает его один раз.
        Старый ключ перестаёт действовать сразу; `id`, имя и история остаются.
      tags: [devices]
      responses:
        "200":
          description: Новый пароль
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceWithPassword"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/users:
    get:
      operationId: listUsers
      summary: Пользователи
      description: Только администратору — для выбора владельца нового устройства.
      tags: [users]
      responses:
        "200":
          description: Пользователи по имени
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    DeviceID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  headers:
    SessionCookie:
      description: "`ksb_session=…; Path=/; Max-Age=2592000; HttpOnly; SameSite=Lax` (`Secure` по HTTPS)"
      schema:
        type: string
  responses:
    NotFound:
      description: "`not_found`: устройства нет или оно недоступно владельцу сессии"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "`forbidden`: операция только для администратора"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DeviceExists:
      description: "`device_exists`: у владельца есть действующее устройство с таким именем"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: "`unauthorized`: нет действующей сессии"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CrossOrigin:
      description: "`cross_origin`: изменяющий запрос браузера с чужого origin"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyAttempts:
      description: "`too_many_attempts`: адрес заблокирован за неудачные входы"
      headers:
        Retry-After:
          description: Через сколько секунд повторить
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error:
      description: Ошибка
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Version:
      type: object
      required: [version, commit]
      properties:
        version:
          type: string
          example: v0.1.0
        commit:
          type: string
          example: 1a2b3c4
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Машинно-читаемый код ошибки, например `not_found`.
          example: not_found
        message:
          type: string
          description: Описание для разработчика; пользователю показывается перевод по `code`.
    Role:
      type: string
      enum: [admin, user]
    Me:
      type: object
      required: [username, role]
      properties:
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 256
    SetupStatus:
      type: object
      required: [required]
      properties:
        required:
          type: boolean
    SetupRequest:
      type: object
      required: [code, username, password]
      properties:
        code:
          type: string
          description: Код из лога сервера; регистр, пробелы по краям и дефисы не важны.
          example: abcd-efgh-ijkl
        username:
          type: string
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 256
    DeviceName:
      type: string
      description: Пробелы по краям обрезаются; после обрезки 1–64 символа.
      example: Kobo Clara
    Device:
      type: object
      required: [id, name, owner, created_at, last_used_at, revoked_at, reported_device]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        owner:
          type: string
          description: Имя пользователя-владельца.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        reported_device:
          type: string
          nullable: true
          description: Поле `device` последнего события прогресса этого устройства.
          example: PocketBook 740
    DeviceWithPassword:
      type: object
      required: [device, password]
      properties:
        device:
          $ref: "#/components/schemas/Device"
        password:
          type: string
          description: Пароль для KOReader; больше нигде не показывается.
          example: abcd-efgh
    CreateDeviceRequest:
      type: object
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/DeviceName"
        username:
          type: string
          description: Владелец; по умолчанию — владелец сессии.
    RenameDeviceRequest:
      type: object
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/DeviceName"
    UserSummary:
      type: object
      required: [username, role, disabled]
      properties:
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        disabled:
          type: boolean
