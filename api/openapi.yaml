openapi: 3.0.3
info:
  title: koreader-sync-board panel API
  version: 0.1.0
  description: |
    API веб-панели. Ошибки возвращаются машинно-читаемым кодом, текст для
    пользователя переводит клиент. Протокол синхронизации KOReader (kosync)
    обслуживается в корне URL и здесь не описан.

    Авторизация — cookie сессии `ksb_session` (`HttpOnly`, `SameSite=Lax`), которую
    ставят вход (паролем или через OIDC) и мастер настройки. Без сессии доступны только
    health, version, способы входа, вход, выход и мастер; остальные операции отвечают
    401 `unauthorized`.
    Изменяющие запросы из браузера с чужого origin отклоняются с 403 `cross_origin`.
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Проверка работоспособности
      description: Без авторизации и без требований к заголовкам; для оркестраторов и `ksb healthcheck`.
      tags: [system]
      responses:
        "200":
          description: Сервер работает
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/version:
    get:
      operationId: getVersion
      summary: Версия сборки
      tags: [system]
      responses:
        "200":
          description: Версия и коммит, заданные при сборке
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Вход в панель
      description: |
        Проверяет пароль панели и открывает сессию. Неизвестное имя, неверный пароль,
        отключённый пользователь и пользователь без пароля панели дают одинаковый
        ответ. Неудачи расходуют бюджет ограничителя по адресу, общий с kosync.
        Если вход по паролю выключен, верный пароль пользователя с привязанным OIDC
        даёт 403 `password_login_disabled` без сессии.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Вход выполнен, cookie сессии выставлена
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          description: "`invalid_credentials`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "`password_login_disabled` или `cross_origin`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Выход
      description: Удаляет текущую сессию и стирает cookie. Без сессии ничего не делает.
      tags: [auth]
      responses:
        "204":
          description: Сессии больше нет
        "403":
          $ref: "#/components/responses/CrossOrigin"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/methods:
    get:
      operationId: getAuthMethods
      summary: Способы входа
      description: Что показать на экране входа. Доступен без сессии.
      tags: [auth]
      responses:
        "200":
          description: Доступные способы входа
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMethods"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/oidc/login:
    get:
      operationId: oidcLogin
      summary: Начать вход через OIDC
      description: |
        Навигация браузера, не XHR. Отвечает 302 на провайдера и ставит cookie потока
        `ksb_oidc`. Запрос не на хост `KSB_PUBLIC_URL` сначала перенаправляется туда же
        на публичный адрес, без cookie. Ошибка discovery — 302 на
        `/login?oidc_error=oidc_unavailable`.
      tags: [auth]
      parameters:
        - name: redirect
          in: query
          required: false
          description: Путь внутри панели, куда вернуться после входа; иной заменяется на `/`.
          schema:
            type: string
      responses:
        "302":
          $ref: "#/components/responses/Redirect"
        "404":
          $ref: "#/components/responses/OIDCNotConfigured"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/oidc/callback:
    get:
      operationId: oidcCallback
      summary: Возврат с OIDC-провайдера
      description: |
        Адрес возврата, зарегистрированный у провайдера: `KSB_PUBLIC_URL` +
        `/api/v1/auth/oidc/callback`. Всегда стирает `ksb_oidc` и отвечает 302: при
        входе — на сохранённый `redirect` с cookie сессии, при привязке — на
        `/account?oidc=linked`; ошибки — на `/login?oidc_error=<код>` или
        `/account?oidc_error=<код>`. Коды: `oidc_denied`, `oidc_failed`,
        `oidc_unavailable`, `setup_required`, `oidc_not_linked`, `account_disabled`,
        `oidc_invalid_username`, `oidc_username_taken`, `oidc_already_linked`,
        `oidc_session_expired`. Параметры необязательны: их отсутствие — ошибка потока.
      tags: [auth]
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
        - name: error_description
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          $ref: "#/components/responses/Redirect"
        "404":
          $ref: "#/components/responses/OIDCNotConfigured"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me:
    get:
      operationId: getMe
      summary: Текущий пользователь
      tags: [auth]
      responses:
        "200":
          description: Владелец сессии
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/password:
    put:
      operationId: changePassword
      summary: Смена своего пароля панели
      description: |
        Меняет пароль при верном текущем и удаляет все остальные сессии пользователя;
        текущая остаётся. Неверный текущий пароль расходует бюджет ограничителя.
        Пользователю без пароля панели первый пароль задаётся без `current_password`,
        сессии не трогаются. Если вход по паролю выключен, а пользователь привязан к
        OIDC — 403 `password_login_disabled`.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Пароль изменён
        "400":
          description: "`invalid_password` или `bad_request`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`invalid_credentials` (неверный текущий пароль), `password_login_disabled` или `cross_origin`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/oidc:
    post:
      operationId: startOIDCLink
      summary: Начать привязку OIDC
      description: |
        Ставит cookie потока `ksb_oidc` с признаком привязки и возвращает адрес
        провайдера; клиент переходит на него. Повторная привязка заменяет прежнюю.
      tags: [auth]
      responses:
        "200":
          description: Адрес авторизации у провайдера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCLinkStart"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/OIDCNotConfigured"
        "409":
          description: "`oidc_wrong_host`: панель открыта не по `KSB_PUBLIC_URL`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "`oidc_unavailable`: провайдер недоступен"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: unlinkOIDC
      summary: Отвязать OIDC
      tags: [auth]
      responses:
        "204":
          description: Привязки нет
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/OIDCNotConfigured"
        "409":
          description: "`last_login_method`: у пользователя нет пароля панели"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/setup:
    get:
      operationId: getSetup
      summary: Нужен ли мастер первого запуска
      tags: [setup]
      responses:
        "200":
          description: "`required` истинно, пока пользователей нет и код настройки существует"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: completeSetup
      summary: Создать первого администратора
      description: |
        По коду настройки из лога сервера создаёт администратора и открывает ему
        сессию. Неверный код расходует бюджет ограничителя; ошибка имени или пароля
        при верном коде — нет, и код остаётся действительным.
      tags: [setup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "200":
          description: Администратор создан, cookie сессии выставлена
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: "`invalid_username`, `invalid_password` или `bad_request`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "`invalid_setup_code` или `cross_origin`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`setup_completed`: пользователи уже есть"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/devices:
    get:
      operationId: listDevices
      summary: Устройства
      description: |
        Свои устройства, включая отозванные; администратору — устройства всех
        пользователей. Ключи и их хеши в ответ не попадают.
      tags: [devices]
      responses:
        "200":
          description: Устройства по владельцу и времени создания
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createDevice
      summary: Создать устройство
      description: |
        Создаёт устройство и возвращает его пароль. Пароль показывается только в
        этом ответе. Без `username` устройство создаётся владельцу сессии; другого
        пользователя может указать только администратор.
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeviceRequest"
      responses:
        "201":
          description: Устройство создано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceWithPassword"
        "400":
          description: "`invalid_device_name` или `bad_request`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`forbidden` (чужой `username` у не администратора) или `cross_origin`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "`user_not_found`: пользователя `username` нет"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/DeviceExists"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/devices/{id}:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    patch:
      operationId: renameDevice
      summary: Переименовать устройство
      description: Меняет имя действующего устройства; ключ остаётся прежним.
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameDeviceRequest"
      responses:
        "200":
          description: Устройство с новым именем
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          description: "`invalid_device_name` или `bad_request`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DeviceExists"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: revokeDevice
      summary: Отозвать устройство
      description: |
        Ключ устройства перестаёт действовать сразу. Запись остаётся: на неё
        ссылается журнал прогресса. Повторный отзыв не меняет время отзыва.
      tags: [devices]
      responses:
        "204":
          description: Устройство отозвано
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/devices/{id}/password:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    post:
      operationId: resetDevicePassword
      summary: Новый пароль устройства
      description: |
        Выдаёт действующему устройству новый пароль и возвращает его один раз.
        Старый ключ перестаёт действовать сразу; `id`, имя и история остаются.
      tags: [devices]
      responses:
        "200":
          description: Новый пароль
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceWithPassword"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/users:
    get:
      operationId: listUsers
      summary: Пользователи
      description: Только администратору — для выбора владельца нового устройства.
      tags: [users]
      responses:
        "200":
          description: Пользователи по имени
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/books:
    get:
      operationId: listBooks
      summary: Книги
      description: |
        Книги владельца сессии (в том числе администратора — только свои): по одной на
        документ, по которому есть прогресс, от последней синхронизации к более ранним.
        Счётчики считаются по всем книгам пользователя независимо от фильтра и страницы.
      tags: [progress]
      parameters:
        - name: filter
          in: query
          required: false
          description: |
            `reading` — не прочитанные, `finished` — прочитанные (процент при показе с одним
            знаком округляется до 100 %), `unknown` — без названия и имени файла (в том
            числе в статистике чтения). Без
            параметра — все книги.
          schema:
            $ref: "#/components/schemas/BookFilter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Страница книг
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/books/{hash}:
    parameters:
      - $ref: "#/components/parameters/BookHash"
    get:
      operationId: getBook
      summary: Книга
      description: Книга и последнее состояние на каждом устройстве, с которого она синхронизировалась.
      tags: [progress]
      responses:
        "200":
          description: Книга и устройства от последней синхронизации к более ранним
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/BookNotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/books/{hash}/statistics:
    parameters:
      - $ref: "#/components/parameters/BookHash"
    get:
      operationId: getBookStatistics
      summary: Статистика книги
      description: |
        Статистика чтения книги из снимка владельца сессии (в том числе администратора —
        только своя) и изменение процента за сегодня по журналу прогресса. Книга без
        прогресса — 404, как карточка книги. Цифры считаются по тем же правилам, что итоги
        `/statistics/summary`; дни — по часовому поясу `tz`.
      tags: [statistics]
      parameters:
        - $ref: "#/components/parameters/TimeZone"
      responses:
        "200":
          description: Статистика книги
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookStatistics"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/BookNotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/activity:
    get:
      operationId: listActivity
      summary: Лента активности
      description: |
        Синхронизации владельца сессии, свёрнутые в записи: подряд идущие синхронизации
        одного документа с одного устройства с паузами меньше 30 минут — одна запись.
        Время — время получения сервером.
      tags: [progress]
      parameters:
        - name: document
          in: query
          required: false
          description: Хеш документа — лента одной книги.
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Страница ленты от последней синхронизации к более ранним
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/BookNotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/statistics:
    get:
      operationId: getStatistics
      summary: Снимок статистики чтения
      description: |
        Состояние последнего принятого `statistics.sqlite3` владельца сессии (в том числе
        администратора — только своё): когда и откуда пришёл, сколько в нём книг и записей.
        Снимок приходит с читалок через облачную синхронизацию KOReader (WebDAV, `/dav/`)
        или загружается из панели.
      tags: [statistics]
      responses:
        "200":
          description: "`snapshot = null`, если статистика ещё не синхронизировалась"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatisticsState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/statistics/import:
    post:
      operationId: importStatistics
      summary: Загрузить statistics.sqlite3
      description: |
        Принимает файл статистики KOReader. Снимка нет — файл становится снимком. Снимок
        есть — файл объединяется с ним по правилам KOReader без удалений (книги по
        названию, авторам и хешу; записи по книге, странице и началу, большая длительность
        побеждает). Читалки получат результат при следующей синхронизации. Если снимок
        менялся во время объединения, оно повторяется до трёх раз.
      tags: [statistics]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Новое состояние снимка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatisticsState"
        "400":
          description: "`invalid_statistics`: файл не является статистикой KOReader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "409":
          description: "`conflict`: снимок менялся во время каждой попытки объединения"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "`file_too_large`: файл больше 64 МиБ"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/statistics/summary:
    get:
      operationId: getStatisticsSummary
      summary: Итоги статистики за период
      description: |
        Итоги статистики чтения владельца сессии (в том числе администратора — только
        свои) за период по сегодня включительно и за такой же период перед ним. Дни и часы
        считаются по часовому поясу `tz`. Страницы пересчитываются к текущему числу
        страниц книги, как во вьюхе `page_stat` KOReader; за день книга даёт число
        различных страниц, страницы периода — сумма дневных. Без снимка — нули,
        `as_of = null`.
      tags: [statistics]
      parameters:
        - name: period
          in: query
          required: true
          description: "`week` — 7 дней, `month` — 30 дней, `year` — 12 календарных месяцев."
          schema:
            $ref: "#/components/schemas/StatisticsPeriod"
        - $ref: "#/components/parameters/TimeZone"
      responses:
        "200":
          description: Итоги периода
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatisticsSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/statistics/calendar:
    get:
      operationId: getStatisticsCalendar
      summary: Календарь чтения
      description: |
        Время чтения по дням за 53 недели: с понедельника недели, начавшейся 52 недели
        назад от текущей, по сегодня. Дни — по часовому поясу `tz`.
      tags: [statistics]
      parameters:
        - $ref: "#/components/parameters/TimeZone"
      responses:
        "200":
          description: Дни с чтением
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatisticsCalendar"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/statistics/sessions:
    get:
      operationId: listReadingSessions
      summary: Сессии чтения
      description: |
        Сессии чтения владельца сессии от последней к более ранним. KOReader сессий не
        хранит, их выводит сервер: подряд идущие записи одной книги, в которых начало
        следующей записи отстоит от наибольшего конца предыдущих не больше чем на 10 минут.
        Устройства у сессии нет: снимок — слияние всех читалок.
      tags: [statistics]
      parameters:
        - name: document
          in: query
          required: false
          description: |
            Хеш документа — сессии одной книги. Сессии строятся по всем записям
            пользователя, поэтому их границы те же, что без фильтра. Хеша нет в снимке —
            пустой список.
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Страница сессий
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingSessionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/library:
    get:
      operationId: getLibrary
      summary: Сводка библиотеки
      description: Число книг, файлов и корней и состояние скана. Доступна любому пользователю.
      tags: [library]
      responses:
        "200":
          description: Сводка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibrarySummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/library/roots:
    get:
      operationId: listLibraryRoots
      summary: Корни библиотеки
      description: Только администратору.
      tags: [library]
      responses:
        "200":
          description: Корни в порядке добавления
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryRootList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createLibraryRoot
      summary: Добавить корень
      description: |
        Только администратору. Путь приводится к канонической форме и должен быть
        абсолютным путём читаемого каталога на сервере, не вложенным в другой корень и
        не содержащим его. Сервер в корне ничего не пишет. Добавление запускает скан.
      tags: [library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLibraryRootRequest"
      responses:
        "201":
          description: Корень добавлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryRoot"
        "400":
          description: "`invalid_path` (в `message` — причина) или `bad_request`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`forbidden` (не администратор) или `cross_origin`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`root_exists` — корень с этим путём уже есть; `root_overlap` — путь вложен в другой корень или содержит его"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/library/roots/{id}:
    parameters:
      - $ref: "#/components/parameters/LibraryRootID"
    delete:
      operationId: deleteLibraryRoot
      summary: Удалить корень
      description: |
        Только администратору. Убирает из индекса файлы корня и книги, у которых не
        осталось файлов. Файлы на диске не трогаются.
      tags: [library]
      responses:
        "204":
          description: Корень удалён
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`forbidden` (не администратор) или `cross_origin`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "`not_found`: корня нет"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/library/scan:
    post:
      operationId: scanLibrary
      summary: Сканировать библиотеку
      description: |
        Только администратору. Ставит скан всех корней в очередь. Если скан уже идёт,
        после него выполнится ещё ровно один.
      tags: [library]
      responses:
        "202":
          description: Скан поставлен в очередь, `scan.running = true`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibrarySummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`forbidden` (не администратор) или `cross_origin`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/library/books:
    get:
      operationId: listLibraryBooks
      summary: Каталог библиотеки
      description: Книги от последней созданной к более ранним. Доступен любому пользователю.
      tags: [library]
      parameters:
        - name: q
          in: query
          required: false
          description: |
            Поиск: каждое слово должно входить в название, авторов, серию или путь одного из
            файлов книги. Регистр, порядок слов, пунктуация и различие `ё`/`е` не важны. Не
            длиннее 200 символов.
          schema:
            type: string
            maxLength: 200
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Страница каталога
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryBookPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/library/books/{id}:
    parameters:
      - $ref: "#/components/parameters/LibraryBookID"
    get:
      operationId: getLibraryBook
      summary: Книга библиотеки
      description: |
        Книга и её файлы по возрастанию id. Прогресс у файлов — только владельца сессии.
        Доступна любому пользователю.
      tags: [library]
      responses:
        "200":
          description: Книга и файлы
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryBookDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/LibraryNotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/library/books/{id}/merge:
    parameters:
      - $ref: "#/components/parameters/LibraryBookID"
    post:
      operationId: mergeLibraryBooks
      summary: Объединить книги
      description: |
        Только администратору. Ключи группировки и файлы книги `book_id` переходят в книгу
        `{id}`, файлы закрепляются за ней, книга `book_id` удаляется. Прогресс не меняется.
      tags: [library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeLibraryBooksRequest"
      responses:
        "200":
          description: Книга `{id}` после слияния
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryBookDetail"
        "400":
          description: "`bad_request`: неверное тело или слияние книги с собой"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`forbidden` (не администратор) или `cross_origin`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/LibraryNotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/library/books/{id}/metadata/candidates:
    parameters:
      - $ref: "#/components/parameters/LibraryBookID"
    get:
      operationId: getLibraryBookMetadataCandidates
      summary: Найти метаданные книги
      description: |
        Только администратору. Кандидаты из файлов книги и внешних каталогов. Без `q` и
        `isbn` запрос строится сам: ISBN из файлов, текст из названия и авторов, иначе из
        имени файла. Если передан хотя бы один параметр, поиск идёт только по переданному.
        Сбой каталога отражается в `providers`, ответ остаётся 200.
      tags: [library]
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: isbn
          in: query
          schema:
            type: string
          description: ISBN-10 или ISBN-13, дефисы допустимы.
      responses:
        "200":
          description: Кандидаты и состояние каталогов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryMetadataCandidates"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/LibraryNotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/library/books/{id}/metadata:
    parameters:
      - $ref: "#/components/parameters/LibraryBookID"
    put:
      operationId: putLibraryBookMetadata
      summary: Сохранить правку метаданных
      description: |
        Только администратору. Заменяет все правки книги: значение, совпавшее с данными
        файла, не хранится, пустое — скрывает значение файла. При наличии правок все файлы
        книги закрепляются за ней.
      tags: [library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryMetadataForm"
      responses:
        "200":
          description: Книга после сохранения
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryBookDetail"
        "400":
          description: "`invalid_metadata`: значение вне ограничений, запрещённый адрес обложки, `cover_url` вместе с `reset_cover`; `bad_request`: неверное тело"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/LibraryNotFound"
        "502":
          description: "`cover_unavailable`: изображение не удалось скачать или декодировать, правки не изменились"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteLibraryBookMetadata
      summary: Сбросить правки метаданных
      description: Только администратору. Удаляет все правки книги, включая обложку. Закрепление файлов остаётся.
      tags: [library]
      responses:
        "200":
          description: Книга после сброса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryBookDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/LibraryNotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/library/covers/{cover}:
    parameters:
      - name: cover
        in: path
        required: true
        description: Значение поля `cover` книги.
        schema:
          type: string
          pattern: "^[0-9a-f]{64}$"
    get:
      operationId: getLibraryCover
      summary: Миниатюра обложки
      description: |
        JPEG, вписанный в 384×576. Адрес неизменяем, поэтому ответ кешируется браузером надолго.
        Доступно любому пользователю.
      tags: [library]
      responses:
        "200":
          description: Миниатюра
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: Совпал `If-None-Match`
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/LibraryNotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/library/files/{id}:
    parameters:
      - $ref: "#/components/parameters/LibraryFileID"
    delete:
      operationId: deleteLibraryFile
      summary: Удалить сконвертированный файл
      description: Только администратор и только файл, созданный конвертацией. Прогресс по нему сохраняется.
      tags: [library]
      responses:
        "204":
          description: Файл удалён из индекса и с диска
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`forbidden` (не администратор) или `cross_origin`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/LibraryNotFound"
        "409":
          description: "`not_converted` — файл из обычного корня."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/library/files/{id}/convert:
    parameters:
      - $ref: "#/components/parameters/LibraryFileID"
    post:
      operationId: convertLibraryFile
      summary: Сконвертировать FB2 в EPUB
      description: |
        Создаёт EPUB в той же книге, доступно любому пользователю. Если для этого содержимого
        результат уже есть, возвращает его. Отключение клиента конвертацию не прерывает.
      tags: [library]
      responses:
        "200":
          description: Готовый файл
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryConvertResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "`not_found` — файла нет в индексе; `file_unavailable` — файл не открывается."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`not_convertible` — формат не FB2."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "`file_too_large` — больше 128 МиБ после распаковки."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`conversion_failed` — конвертер не справился с файлом."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: "`conversion_timeout` — не уложились в 5 минут вместе с очередью."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/library/files/{id}/content:
    parameters:
      - $ref: "#/components/parameters/LibraryFileID"
    get:
      operationId: getLibraryFileContent
      summary: Скачать файл
      description: |
        Текущее содержимое файла на диске, с `Range`. `HEAD` обслуживается тем же маршрутом и
        отдаёт только заголовки. Доступно любому пользователю.
      tags: [library]
      responses:
        "200":
          description: Файл целиком; `Content-Type` — по формату, имя — в `Content-Disposition`
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Запрошенный диапазон
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            `not_found` — файла нет в индексе; `file_unavailable` — файл в индексе, но не
            открывается (корень недоступен, файл удалён или ведёт за пределы корня).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "416":
          description: |
            Диапазон неудовлетворим. Стандартный ответ HTTP с текстовым телом, без кода ошибки:
            его разбирают браузер и менеджеры загрузок.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/library/files/{id}/split:
    parameters:
      - $ref: "#/components/parameters/LibraryFileID"
    post:
      operationId: splitLibraryFile
      summary: Отделить файл в новую книгу
      description: Только администратору. Файл уходит в новую книгу без ключей и закрепляется за ней.
      tags: [library]
      responses:
        "201":
          description: Новая книга
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryBookDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`forbidden` (не администратор) или `cross_origin`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/LibraryNotFound"
        "409":
          description: "`single_file`: файл единственный в своей книге"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    LibraryBookID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    LibraryFileID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    LibraryRootID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    DeviceID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    BookHash:
      name: hash
      in: path
      required: true
      description: Хеш документа, как его прислала читалка.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Размер страницы.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: "`next_cursor` предыдущей страницы; клиент его не разбирает."
      schema:
        type: string
    TimeZone:
      name: tz
      in: query
      required: true
      description: Часовой пояс IANA (`Europe/Moscow`, `UTC`), по которому считаются дни и часы.
      schema:
        type: string
        example: Europe/Moscow
  headers:
    SessionCookie:
      description: "`ksb_session=…; Path=/; Max-Age=2592000; HttpOnly; SameSite=Lax` (`Secure` по HTTPS)"
      schema:
        type: string
  responses:
    Redirect:
      description: Перенаправление браузера
      headers:
        Location:
          schema:
            type: string
    OIDCNotConfigured:
      description: "`not_found`: OIDC не настроен"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "`not_found`: устройства нет или оно недоступно владельцу сессии"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BookNotFound:
      description: "`not_found`: у владельца сессии нет прогресса по этому документу"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LibraryNotFound:
      description: "`not_found`: книги или файла нет"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: "`bad_request`: неверный параметр запроса"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "`forbidden`: операция только для администратора"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DeviceExists:
      description: "`device_exists`: у владельца есть действующее устройство с таким именем"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: "`unauthorized`: нет действующей сессии"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CrossOrigin:
      description: "`cross_origin`: изменяющий запрос браузера с чужого origin"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyAttempts:
      description: "`too_many_attempts`: адрес заблокирован за неудачные входы"
      headers:
        Retry-After:
          description: Через сколько секунд повторить
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error:
      description: Ошибка
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    LibrarySummary:
      type: object
      required: [books, files, roots, scan]
      properties:
        books:
          type: integer
        files:
          type: integer
        roots:
          type: integer
        scan:
          $ref: "#/components/schemas/LibraryScan"
    LibraryScan:
      type: object
      required: [running, started_at, finished_at]
      properties:
        running:
          type: boolean
          description: Скан идёт или поставлен в очередь.
        started_at:
          type: string
          format: date-time
          nullable: true
          description: Начало текущего скана; `null`, если скан не идёт.
        finished_at:
          type: string
          format: date-time
          nullable: true
          description: Конец последнего завершённого скана корня; `null`, если сканов не было.
    LibraryRoot:
      type: object
      required: [id, name, path, files, scanned_at, error]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        path:
          type: string
          description: Абсолютный путь на сервере.
          example: /books
        files:
          type: integer
          description: Число проиндексированных файлов.
        scanned_at:
          type: string
          format: date-time
          nullable: true
          description: Конец последнего завершённого скана; `null`, если корень ещё не сканировался.
        error:
          type: string
          nullable: true
          description: Ошибка последнего скана; `null`, если он прошёл без ошибок.
    LibraryRootList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LibraryRoot"
    CreateLibraryRootRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          example: /books
        name:
          type: string
          description: Пустое или отсутствующее — последний элемент пути.
    LibraryBook:
      type: object
      required: [id, title, authors, series, series_index, language, files, formats, filename, cover]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          nullable: true
        authors:
          type: string
          nullable: true
        series:
          type: string
          nullable: true
        series_index:
          type: number
          format: double
          nullable: true
        language:
          type: string
          nullable: true
        files:
          type: integer
          description: Число файлов.
        formats:
          type: array
          description: Различные форматы файлов в порядке их id.
          items:
            type: string
          example: [fb2, epub]
        filename:
          type: string
          description: Имя без каталогов файла с наименьшим id.
        cover:
          type: string
          nullable: true
          description: |
            Идентификатор миниатюры для `GET /api/v1/library/covers/{cover}`: обложка правки, иначе
            файла с наименьшим id среди файлов книги с обложкой. `null`, если обложки нет.
    LibraryBookPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LibraryBook"
        next_cursor:
          type: string
          nullable: true
          description: "`null` на последней странице."
    LibraryFileProgress:
      type: object
      required: [hash, percentage, finished, updated_at]
      description: Последнее по времени состояние прогресса владельца сессии по любому из хешей файла.
      properties:
        hash:
          type: string
          description: Хеш документа, адрес карточки прогресса.
        percentage:
          type: number
          format: double
        finished:
          type: boolean
        updated_at:
          type: string
          format: date-time
    LibraryFile:
      type: object
      required: [id, root_name, path, format, size, title, authors, pinned, converted, convertible, progress]
      properties:
        id:
          type: integer
          format: int64
        root_name:
          type: string
        path:
          type: string
          description: Относительно корня, через `/`.
        format:
          type: string
          example: epub
        size:
          type: integer
          format: int64
        title:
          type: string
          nullable: true
        authors:
          type: string
          nullable: true
        pinned:
          type: boolean
          description: Книгу файла задал человек, скан не переносит его по ключу.
        converted:
          type: boolean
          description: Файл создан конвертацией.
        convertible:
          type: boolean
          description: Формат FB2, и результата конвертации этого содержимого нет.
        progress:
          allOf:
            - $ref: "#/components/schemas/LibraryFileProgress"
          nullable: true
    LibraryConvertResult:
      type: object
      required: [file_id]
      properties:
        file_id:
          type: integer
          format: int64
    LibraryBookDetail:
      type: object
      required: [book, files, description, metadata]
      properties:
        book:
          $ref: "#/components/schemas/LibraryBook"
        files:
          type: array
          items:
            $ref: "#/components/schemas/LibraryFile"
        description:
          type: string
          nullable: true
          description: Аннотация из правки.
        metadata:
          allOf:
            - $ref: "#/components/schemas/LibraryBookMetadataInfo"
          nullable: true
          description: "`null`, если правок нет."
    LibraryBookMetadataInfo:
      type: object
      required: [source, updated_at]
      properties:
        source:
          type: string
          nullable: true
          description: "`file`, `fantlab`, `openlibrary`, `google`; `null` — вручную."
        updated_at:
          type: string
          format: date-time
    LibraryMetadataCandidates:
      type: object
      required: [query, isbn, items, providers]
      properties:
        query:
          type: string
          nullable: true
          description: Текст, по которому шёл поиск.
        isbn:
          type: string
          nullable: true
          description: ISBN, по которому шёл поиск.
        items:
          type: array
          items:
            $ref: "#/components/schemas/LibraryMetadataCandidate"
        providers:
          type: array
          items:
            $ref: "#/components/schemas/LibraryMetadataProvider"
    LibraryMetadataProvider:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          example: fantlab
        status:
          type: string
          description: "`ok` или `error`."
    LibraryMetadataCandidate:
      type: object
      required: [provider, match, title, authors, series, series_index, language, year, description, isbn, cover_url, url]
      properties:
        provider:
          type: string
          description: "`file`, `fantlab`, `openlibrary` или `google`."
        match:
          type: string
          description: "`file`, `isbn` или `text`."
        title:
          type: string
          nullable: true
        authors:
          type: string
          nullable: true
        series:
          type: string
          nullable: true
        series_index:
          type: number
          format: double
          nullable: true
        language:
          type: string
          nullable: true
        year:
          type: integer
          nullable: true
        description:
          type: string
          nullable: true
          description: Простой текст, абзацы разделены пустой строкой.
        isbn:
          type: string
          nullable: true
        cover_url:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
    LibraryMetadataForm:
      type: object
      description: Форма целиком. Отсутствующее или пустое поле означает, что значения нет.
      properties:
        title:
          type: string
          nullable: true
          maxLength: 500
        authors:
          type: string
          nullable: true
          maxLength: 1000
        series:
          type: string
          nullable: true
          maxLength: 500
        series_index:
          type: number
          format: double
          nullable: true
          minimum: 0
        language:
          type: string
          nullable: true
          maxLength: 16
        description:
          type: string
          nullable: true
          maxLength: 20000
        source:
          type: string
          nullable: true
          description: "`file`, `fantlab`, `openlibrary`, `google`; `null` — вручную."
        cover_url:
          type: string
          nullable: true
          description: Скачать и заменить обложку правки. Без него и без `reset_cover` обложка не меняется.
        reset_cover:
          type: boolean
          description: Убрать обложку правки. Вместе с `cover_url` — ошибка.
    MergeLibraryBooksRequest:
      type: object
      required: [book_id]
      properties:
        book_id:
          type: integer
          format: int64
          description: Книга, которая вливается в `{id}` и удаляется.
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Version:
      type: object
      required: [version, commit]
      properties:
        version:
          type: string
          example: v0.1.0
        commit:
          type: string
          example: 1a2b3c4
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Машинно-читаемый код ошибки, например `not_found`.
          example: not_found
        message:
          type: string
          description: Описание для разработчика; пользователю показывается перевод по `code`.
    Role:
      type: string
      enum: [admin, user]
    Me:
      type: object
      required: [username, role, has_password, oidc_linked]
      properties:
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        has_password:
          type: boolean
          description: Задан ли пароль панели.
        oidc_linked:
          type: boolean
          description: Привязана ли учётка OIDC-провайдера.
    AuthMethods:
      type: object
      required: [password]
      properties:
        password:
          type: string
          enum: ["on", unlinked]
          x-enum-varnames: [PasswordOn, PasswordUnlinked]
          description: |
            `on` — вход по паролю для всех; `unlinked` — только для пользователей без
            привязки OIDC.
        oidc:
          $ref: "#/components/schemas/OIDCMethod"
    OIDCMethod:
      type: object
      description: Есть, только если OIDC настроен.
      required: [name, origin]
      properties:
        name:
          type: string
          description: Подпись кнопки входа.
          example: Zitadel
        origin:
          type: string
          description: Публичный адрес панели (`KSB_PUBLIC_URL`); привязка работает только с него.
          example: https://books.example.com
    OIDCLinkStart:
      type: object
      required: [authorize_url]
      properties:
        authorize_url:
          type: string
          description: Адрес авторизации у провайдера.
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    ChangePasswordRequest:
      type: object
      required: [new_password]
      properties:
        current_password:
          type: string
          format: password
          description: Не нужен пользователю без пароля панели (первый пароль).
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 256
    SetupStatus:
      type: object
      required: [required]
      properties:
        required:
          type: boolean
    SetupRequest:
      type: object
      required: [code, username, password]
      properties:
        code:
          type: string
          description: Код из лога сервера; регистр, пробелы по краям и дефисы не важны.
          example: abcd-efgh-ijkl
        username:
          type: string
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 256
    DeviceName:
      type: string
      description: Пробелы по краям обрезаются; после обрезки 1–64 символа.
      example: Kobo Clara
    Device:
      type: object
      required: [id, name, owner, created_at, last_used_at, revoked_at, reported_device]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        owner:
          type: string
          description: Имя пользователя-владельца.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        reported_device:
          type: string
          nullable: true
          description: Поле `device` последнего события прогресса этого устройства.
          example: PocketBook 740
    DeviceWithPassword:
      type: object
      required: [device, password]
      properties:
        device:
          $ref: "#/components/schemas/Device"
        password:
          type: string
          description: Пароль для KOReader; больше нигде не показывается.
          example: abcd-efgh
    CreateDeviceRequest:
      type: object
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/DeviceName"
        username:
          type: string
          description: Владелец; по умолчанию — владелец сессии.
    RenameDeviceRequest:
      type: object
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/DeviceName"
    UserSummary:
      type: object
      required: [username, role, disabled]
      properties:
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        disabled:
          type: boolean
    BookFilter:
      type: string
      enum: [reading, finished, unknown]
    Book:
      type: object
      required: [hash, title, authors, filename, percentage, finished, updated_at, device_name, reported_device, library_book_id, cover]
      properties:
        hash:
          type: string
          example: 0123456789abcdef0123456789abcdef
        title:
          type: string
          nullable: true
          description: |
            Из `metadata` синхронизаций этого пользователя, а если её не было — из его
            статистики чтения по тому же хешу, а затем из книги библиотеки, которой
            принадлежит файл с этим хешем.
        authors:
          type: string
          nullable: true
          description: Из тех же источников и в том же порядке, что `title`.
        filename:
          type: string
          nullable: true
          description: |
            Из `metadata` синхронизаций, а если её не было — имя файла библиотеки с этим
            хешем (без каталогов).
        percentage:
          type: number
          format: double
          description: Последний присланный процент, 0–1.
          example: 0.624
        finished:
          type: boolean
          description: Процент при показе с одним знаком округляется до 100 % (≥ 0,9995).
        updated_at:
          type: string
          format: date-time
          description: Время получения последней синхронизации.
        device_name:
          type: string
          nullable: true
          description: Имя устройства последней синхронизации в панели; `null`, если устройство удалено.
        reported_device:
          type: string
          description: Поле `device` последней синхронизации как есть.
          example: PocketBook 740
        library_book_id:
          type: integer
          format: int64
          nullable: true
          description: Книга библиотеки, которой принадлежит файл с этим хешем; `null`, если файла нет.
        cover:
          type: string
          nullable: true
          description: Миниатюра этой книги библиотеки (`LibraryBook.cover`); `null`, если её нет.
    BookCounts:
      type: object
      required: [all, reading, finished, unknown]
      properties:
        all:
          type: integer
        reading:
          type: integer
        finished:
          type: integer
        unknown:
          type: integer
    BookPage:
      type: object
      required: [items, next_cursor, counts]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Book"
        next_cursor:
          type: string
          nullable: true
          description: "`null` на последней странице."
        counts:
          $ref: "#/components/schemas/BookCounts"
    BookDevice:
      type: object
      required: [device_name, reported_device, percentage, updated_at]
      properties:
        device_name:
          type: string
          nullable: true
        reported_device:
          type: string
        percentage:
          type: number
          format: double
        updated_at:
          type: string
          format: date-time
    BookDetail:
      type: object
      required: [book, devices]
      properties:
        book:
          $ref: "#/components/schemas/Book"
        devices:
          type: array
          items:
            $ref: "#/components/schemas/BookDevice"
    ActivityItem:
      type: object
      required:
        - hash
        - title
        - authors
        - filename
        - device_name
        - reported_device
        - from_percentage
        - to_percentage
        - started_at
        - ended_at
        - syncs
      properties:
        hash:
          type: string
        title:
          type: string
          nullable: true
        authors:
          type: string
          nullable: true
        filename:
          type: string
          nullable: true
        device_name:
          type: string
          nullable: true
          description: По последней синхронизации записи.
        reported_device:
          type: string
        from_percentage:
          type: number
          format: double
          description: Процент первой синхронизации записи.
        to_percentage:
          type: number
          format: double
          description: Процент последней синхронизации записи.
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        syncs:
          type: integer
          description: Число синхронизаций в записи.
    ActivityPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
        next_cursor:
          type: string
          nullable: true
    StatisticsSource:
      type: string
      enum: [webdav, import]
      description: "`webdav` — выгрузка с читалки, `import` — загрузка из панели."
    StatisticsSnapshot:
      type: object
      required: [uploaded_at, device_name, source, size, books, records, first_read_at, last_read_at]
      properties:
        uploaded_at:
          type: string
          format: date-time
        device_name:
          type: string
          nullable: true
          description: Устройство, выгрузившее снимок; `null` для загрузки из панели.
        source:
          $ref: "#/components/schemas/StatisticsSource"
        size:
          type: integer
          format: int64
          description: Размер файла в байтах.
        books:
          type: integer
        records:
          type: integer
          description: Записи чтения страниц (`page_stat_data`).
        first_read_at:
          type: string
          format: date-time
          nullable: true
          description: Начало самой ранней записи чтения.
        last_read_at:
          type: string
          format: date-time
          nullable: true
          description: Начало самой поздней записи чтения.
    StatisticsState:
      type: object
      required: [snapshot]
      properties:
        snapshot:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/StatisticsSnapshot"
    StatisticsPeriod:
      type: string
      enum: [week, month, year]
    StatisticsTotals:
      type: object
      required: [duration, pages, sessions, days]
      properties:
        duration:
          type: integer
          format: int64
          description: Время чтения, секунды.
        pages:
          type: integer
          description: Сумма различных страниц по дням.
        sessions:
          type: integer
          description: Сессии, начатые в периоде.
        days:
          type: integer
          description: Дни с чтением.
    StatisticsBucket:
      type: object
      required: [date, duration, pages, no_data]
      properties:
        date:
          type: string
          format: date
          description: День или первый день месяца.
        duration:
          type: integer
          format: int64
        pages:
          type: integer
        no_data:
          type: boolean
          description: |
            День позже дня `as_of` (месяц — если все его дни такие): данных за него у
            сервера ещё нет, это не день без чтения.
    StatisticsBookRef:
      type: object
      required: [title, authors, hash, has_progress]
      properties:
        title:
          type: string
          nullable: true
          description: |
            Из `metadata` синхронизаций прогресса пользователя по тому же хешу, а если её
            нет — из статистики чтения.
        authors:
          type: string
          nullable: true
        hash:
          type: string
          nullable: true
          description: "`null` у книги статистики без хеша."
        has_progress:
          type: boolean
          description: Есть ли у пользователя прогресс по этому хешу (карточка книги).
    StatisticsBook:
      allOf:
        - $ref: "#/components/schemas/StatisticsBookRef"
        - type: object
          required: [duration, pages]
          properties:
            duration:
              type: integer
              format: int64
            pages:
              type: integer
    StatisticsSummary:
      type: object
      required: [period, from, to, bucket, as_of, totals, previous, series, hours, books]
      properties:
        period:
          $ref: "#/components/schemas/StatisticsPeriod"
        from:
          type: string
          format: date
        to:
          type: string
          format: date
          description: Сегодня в поясе `tz`.
        bucket:
          type: string
          enum: [day, month]
        as_of:
          type: string
          format: date-time
          nullable: true
          description: Время приёма снимка; `null`, если статистики нет.
        totals:
          $ref: "#/components/schemas/StatisticsTotals"
        previous:
          $ref: "#/components/schemas/StatisticsTotals"
        series:
          type: array
          description: По элементу на каждый день периода (для `year` — на каждый месяц).
          items:
            $ref: "#/components/schemas/StatisticsBucket"
        hours:
          type: array
          description: 24 значения — время чтения за период по часу начала записи, секунды.
          minItems: 24
          maxItems: 24
          items:
            type: integer
            format: int64
        books:
          type: array
          description: До 10 книг с наибольшим временем в периоде.
          items:
            $ref: "#/components/schemas/StatisticsBook"
    StatisticsDay:
      type: object
      required: [date, duration]
      properties:
        date:
          type: string
          format: date
        duration:
          type: integer
          format: int64
    StatisticsCalendar:
      type: object
      required: [from, to, as_of, days]
      properties:
        from:
          type: string
          format: date
          description: Понедельник.
        to:
          type: string
          format: date
        as_of:
          type: string
          format: date-time
          nullable: true
        days:
          type: array
          description: Только дни с чтением, по возрастанию даты.
          items:
            $ref: "#/components/schemas/StatisticsDay"
    ReadingSession:
      type: object
      required: [book, started_at, ended_at, duration, pages]
      properties:
        book:
          $ref: "#/components/schemas/StatisticsBookRef"
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          description: Наибольший конец записи сессии.
        duration:
          type: integer
          format: int64
          description: Сумма длительностей записей, секунды.
        pages:
          type: integer
          description: Различные страницы сессии.
    ReadingSessionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReadingSession"
        next_cursor:
          type: string
          nullable: true
    BookReadingStats:
      type: object
      required:
        - duration
        - pages_read
        - days
        - sessions
        - first_read_at
        - last_read_at
        - page_time
        - pages
        - current_page
        - time_left
      properties:
        duration:
          type: integer
          format: int64
          description: Время чтения книги, секунды.
        pages_read:
          type: integer
          description: Различные страницы книги за всё время, в текущей разметке.
        days:
          type: integer
          description: Дни с чтением книги.
        sessions:
          type: integer
        first_read_at:
          type: string
          format: date-time
          nullable: true
          description: Начало самой ранней записи; `null`, если записей нет.
        last_read_at:
          type: string
          format: date-time
          nullable: true
          description: Наибольший конец записи.
        page_time:
          type: number
          format: double
          nullable: true
          description: |
            Среднее время на страницу, секунды, как в KOReader: время каждой страницы
            ограничивается 120 секундами. `null`, если записей нет.
        pages:
          type: integer
          nullable: true
          description: Число страниц книги из самой поздно открытой строки статистики с известным числом страниц.
        current_page:
          type: integer
          nullable: true
          description: Процент последней синхронизации прогресса, переведённый в страницы (1 — `pages`).
        time_left:
          type: integer
          format: int64
          nullable: true
          description: |
            Оценка времени до конца, секунды: оставшиеся страницы × `page_time`. `null`,
            если страница или среднее неизвестны или книга прочитана.
    BookStatistics:
      type: object
      required: [as_of, percentage_today, stats]
      properties:
        as_of:
          type: string
          format: date-time
          nullable: true
          description: Время приёма снимка; `null`, если статистики нет.
        percentage_today:
          type: number
          format: double
          description: |
            Изменение процента за сегодня в поясе `tz`: от последней синхронизации до начала
            дня (или первой сегодняшней) до последней. Может быть нулевым и отрицательным.
        stats:
          nullable: true
          description: "`null`, если в снимке нет книги с этим хешем."
          allOf:
            - $ref: "#/components/schemas/BookReadingStats"
