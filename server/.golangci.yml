version: "2"
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - misspell
    - sqlclosecheck
  settings:
    errcheck:
      # Закрытие и откат при очистке: ошибка здесь не меняет результат операции.
      exclude-functions:
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (*os.File).Close
        - (io.Closer).Close
        - os.Remove
        - os.RemoveAll
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*github.com/varrcan/koreader-sync-board/server/internal/store.DB).Close
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters: [errcheck]
formatters:
  enable:
    - gofmt
