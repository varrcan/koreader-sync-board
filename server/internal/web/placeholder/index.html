<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>koreader-sync-board</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    main { max-width: 32rem; }
    code { font-size: .9em; }
  </style>
</head>
<body>
  <main>
    <h1>koreader-sync-board</h1>
    <p>The server is running. This binary was built without the web panel:
      build it with <code>task build</code> to embed the panel.</p>
    <p>Version: <span id="version">…</span></p>
  </main>
  <script>
    fetch("/api/v1/version").then(r => r.json())
      .then(v => { document.getElementById("version").textContent = v.version + " (" + v.commit + ")"; })
      .catch(() => { document.getElementById("version").textContent = "unknown"; });
  </script>
</body>
</html>
